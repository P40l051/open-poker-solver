<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101923"/>
      <stop offset="0.55" stop-color="#0c1219"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.15" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#6ff0b4"/>
      <stop offset="0.55" stop-color="#4cc38a"/>
      <stop offset="1" stop-color="#4a9bff"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d5a7a"/>
      <stop offset="1" stop-color="#22303f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#4cc38a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4cc38a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- rounded app tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#halo)"/>
  <rect x="22" y="22" width="980" height="980" rx="208" fill="none" stroke="#22303f" stroke-width="6"/>

  <!-- poker chip ring -->
  <circle cx="512" cy="512" r="372" fill="none" stroke="url(#chip)" stroke-width="30"/>
  <circle cx="512" cy="512" r="372" fill="none" stroke="url(#mark)" stroke-width="30"
          stroke-dasharray="64 108" stroke-linecap="round" opacity="0.95"/>
  <circle cx="512" cy="512" r="330" fill="none" stroke="#1b2531" stroke-width="8"/>

  <!-- spade -->
  <path d="M512 150
           C512 150 286 368 286 540
           C286 646 360 712 458 712
           C496 712 512 680 512 680
           C512 680 528 712 566 712
           C664 712 738 646 738 540
           C738 368 512 150 512 150 Z" fill="url(#mark)" filter="url(#glow)"/>
  <path d="M470 620
           C466 700 452 760 450 810
           L574 810
           C572 760 558 700 554 620 Z" fill="url(#mark)" filter="url(#glow)"/>

  <!-- decision tree inside the spade -->
  <g stroke="#08110d" stroke-width="14" stroke-linecap="round" opacity="0.92">
    <line x1="512" y1="452" x2="424" y2="566"/>
    <line x1="512" y1="452" x2="600" y2="566"/>
  </g>
  <g fill="#08110d">
    <circle cx="512" cy="452" r="30"/>
    <circle cx="424" cy="566" r="24"/>
    <circle cx="600" cy="566" r="24"/>
  </g>
  <g fill="#b8ffdd">
    <circle cx="512" cy="452" r="13"/>
    <circle cx="424" cy="566" r="10"/>
    <circle cx="600" cy="566" r="10"/>
  </g>
</svg>
